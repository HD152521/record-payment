<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>결제 기록장</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    body { width: 320px; padding: 18px; }
    .eyebrow { margin: 0; font-size: 12px; color: var(--ink-soft); font-weight: 600; }
    .total { margin: 2px 0 4px; font-family: var(--font-mono); font-size: 30px; font-weight: 700; letter-spacing: -0.03em; color: var(--kind-subscription); }
    .sub { margin: 0 0 14px; font-size: 13px; color: var(--ink-soft); }
    h2 { font-size: 12px; color: var(--ink-soft); margin: 0 0 6px; padding-top: 12px; border-top: 3px double var(--rule-strong); }
    ul { list-style: none; margin: 0 0 16px; padding: 0; font-size: 13px; }
    li { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; padding: 6px 0; border-bottom: 1px dashed var(--rule); }
    li .site { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    li .num { font-family: var(--font-mono); }
    .empty { color: var(--ink-soft); font-size: 13px; }
    .btn { width: 100%; }
    .cloud { margin: 0 0 14px; padding: 10px 12px; border-radius: var(--radius); background: var(--paper-raised); font-size: 13px; }
    .cloud b { font-family: var(--font-mono); font-size: 16px; }
    .cloud .muted { display: block; font-size: 12px; }
  </style>
</head>
<body>
  <p class="eyebrow">매달 나가는 구독료</p>
  <p class="total" id="total">0원</p>
  <p class="sub" id="sub"></p>
  <p class="cloud" id="cloud" hidden></p>
  <h2>최근 기록</h2>
  <ul id="recent"></ul>
  <button type="button" class="btn" id="open">전체 대시보드 열기</button>
  <script src="lib/detect.js"></script>
  <script src="lib/ledger.js"></script>
  <script src="lib/store.js"></script>
  <script src="lib/cloud/costs.js"></script>
  <script src="ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
