<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>결제 기록장</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    body { width: 330px; padding: 18px 18px 16px; }
    .brand { display: flex; align-items: center; gap: 8px; margin: 0 0 14px; font-size: 12px; font-weight: 700; }
    .brand-mark { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; background: var(--ink); color: var(--paper); font-size: 12px; }
    .eyebrow { margin: 0; font-size: 12px; color: var(--ink-soft); font-weight: 600; }
    .total { margin: 2px 0 4px; font-size: 34px; font-weight: 800; letter-spacing: -0.045em; line-height: 1.1; color: var(--kind-subscription); font-variant-numeric: tabular-nums; }
    .sub { margin: 0 0 14px; font-size: 13px; color: var(--ink-soft); }
    .sub:empty { display: none; }
    h2 { font-size: 12px; color: var(--ink-soft); margin: 0 0 4px; padding-top: 12px; border-top: 3px double var(--rule-strong); }
    ul { list-style: none; margin: 0 0 16px; padding: 0; font-size: 13px; }
    li { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; padding: 7px 0; border-bottom: 1px dashed var(--rule); }
    li:last-child { border-bottom: 0; }
    li .site { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    li .num { font-weight: 700; font-variant-numeric: tabular-nums; }
    .empty { color: var(--ink-soft); font-size: 13px; }
    .btn { width: 100%; min-height: 40px; }
    .cloud { position: relative; margin: 0 0 14px; padding: 10px 12px 10px 16px; border-radius: var(--radius); background: var(--paper-raised); box-shadow: var(--shadow); font-size: 13px; overflow: hidden; }
    .cloud::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--cloud); }
    .cloud b { font-size: 16px; font-variant-numeric: tabular-nums; }
    .cloud .muted { display: block; font-size: 12px; }
  </style>
</head>
<body>
  <p class="brand"><span class="brand-mark" aria-hidden="true">₩</span>결제 기록장</p>
  <p class="eyebrow">이번 달 구독·결제</p>
  <p class="total" id="total">0원</p>
  <p class="sub" id="sub"></p>
  <p class="cloud" id="cloud" hidden></p>
  <h2>최근 기록</h2>
  <ul id="recent"></ul>
  <button type="button" class="btn" id="open">전체 대시보드 열기</button>
  <script src="lib/detect.js"></script>
  <script src="lib/ledger.js"></script>
  <script src="lib/catalog.js"></script>
  <script src="lib/store.js"></script>
  <script src="lib/cloud/costs.js"></script>
  <script src="ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
