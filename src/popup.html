<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>결제 기록장</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="phead">
    <p class="site-brand"><span class="brand-mark" aria-hidden="true">₩</span>결제 기록장</p>
    <span class="sp"></span>
    <button type="button" class="btn soft" id="open">대시보드</button>
  </header>

  <section class="phero" aria-labelledby="total-h">
    <h1 class="eyebrow" id="total-h"><span id="p-month">이번 달</span> 예상 지출 · 원화 환산</h1>
    <p class="big num" id="total">0원</p>
    <p class="delta" id="delta"></p>
    <div class="pbar" id="pbar" role="img" hidden><i id="pbar-fill"></i></div>
    <div class="pmeta" id="pmeta" hidden><span id="pmeta-left"></span><span id="pmeta-right"></span></div>
    <p class="sub" id="cloud-line"></p>
  </section>

  <button type="button" class="alert" id="alert" hidden>
    <span class="ico" id="alert-ico" aria-hidden="true">!</span>
    <span class="alert-t"><b id="alert-title"></b><span id="alert-sub"></span></span>
  </button>

  <section class="sec" aria-labelledby="upcoming-h">
    <h2 id="upcoming-h">곧 나갈 돈<span class="sp"></span><span class="muted" id="soon-total"></span></h2>
    <ul class="upcoming" id="upcoming"></ul>
  </section>

  <footer class="foot">
    <button type="button" class="btn" id="quick-add">＋ 빠른 추가</button>
    <button type="button" class="btn soft" id="open-records">전체 기록</button>
  </footer>
  <script src="lib/detect.js"></script>
  <script src="lib/ledger.js"></script>
  <script src="lib/catalog.js"></script>
  <script src="lib/store.js"></script>
  <script src="lib/cloud/costs.js"></script>
  <script src="lib/forecast.js"></script>
  <script src="lib/history.js"></script>
  <script src="lib/settings.js"></script>
  <script src="lib/home.js"></script>
  <script src="lib/motion.js"></script>
  <script src="ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
